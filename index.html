<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Schedule</title>
    
    <!-- Fonts: Inter (Premium Modern Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6366f1', // Indigo 500
                        primaryLight: '#818cf8', // Indigo 400
                        darkBg: '#09090b', // Zinc 950
                        darkCard: '#18181b', // Zinc 900
                        lightBg: '#f4f4f5', // Zinc 100
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.95)' },
                            '50%': { transform: 'scale(1.08)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(0,0,0,0.08)',
                        'glow': '0 0 20px -5px var(--tw-shadow-color)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
            background-color: #f4f4f5;
        }
        .dark body { background-color: #09090b; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .transition-all-smooth { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }

        /* Custom Checkbox Premium */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #d4d4d8;
            border-radius: 0.4em;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .dark .custom-checkbox { border-color: #3f3f46; }
        
        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #6366f1;
            border-color: #6366f1;
        }
        .custom-checkbox:checked::before { transform: scale(1); }

        /* Glassmorphism Premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        .dark .glass-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .glass-nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .dark .glass-nav {
            background: rgba(24, 24, 27, 0.9);
        }

        /* Desktop Container */
        @media (min-width: 640px) {
            body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
            #app-container {
                width: 100%; max-width: 400px; height: 90vh; max-height: 850px;
                border-radius: 2.5rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                border: 8px solid #e4e4e7; position: relative;
            }
            .dark #app-container { border-color: #27272a; }
        }
    </style>
</head>
<body class="text-zinc-900 dark:text-zinc-100 transition-colors duration-300">

    <div id="app-container" class="flex flex-col h-screen h-[100dvh] w-full relative bg-lightBg dark:bg-darkBg overflow-hidden sm:overflow-visible">
        
        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-32 relative">
            <!-- Views injected via JS -->
        </main>

        <!-- Floating Bottom Navigation -->
        <div id="bottom-nav-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-[360px] z-30 transition-transform duration-300">
            <nav class="glass-nav rounded-3xl px-2 py-2 shadow-2xl border border-zinc-200/50 dark:border-zinc-800/80 flex justify-between items-center relative">

                    <i data-lucide="layout-grid" class="w-6 h-6 mb-1 transition-transform group-active:scale-90"></i>
                    <span class="text-[10px] font-semibold">Home</span>
                </button>
                
                <button class="nav-item flex-1 flex flex-col items-center p-2 text-zinc-400 dark:text-zinc-500 hover:text-zinc-600 dark:hover:text-zinc-300 group transition-colors" data-target="schedule">
                    <i data-lucide="calendar" class="w-6 h-6 mb-1 transition-transform group-active:scale-90"></i>
                    <span class="text-[10px] font-medium">Jadwal</span>
                </button>
                
                <!-- Floating Action Button (Integrated in Nav) -->
                <div class="flex-1 flex justify-center relative">
                    <button id="fab-btn" class="absolute -top-10 w-14 h-14 bg-primary hover:bg-indigo-600 text-white rounded-full shadow-lg shadow-indigo-500/40 flex items-center justify-center transition-transform active:scale-90 border-[4px] border-lightBg dark:border-darkBg z-40">
                        <i data-lucide="plus" class="w-7 h-7"></i>
                    </button>
                </div>

                <button class="nav-item flex-1 flex flex-col items-center p-2 text-zinc-400 dark:text-zinc-500 hover:text-zinc-600 dark:hover:text-zinc-300 group transition-colors" data-target="habits">
                    <i data-lucide="sparkles" class="w-6 h-6 mb-1 transition-transform group-active:scale-90"></i>

                    <span class="text-[10px] font-medium">Statistik</span>

        </div>

        <!-- Overlay -->

        <!-- Quick Add Bottom Sheet -->
        <div id="quick-add-sheet" class="fixed bottom-0 left-0 right-0 sm:absolute sm:bottom-0 bg-white dark:bg-darkCard rounded-t-[2rem] z-50 transform translate-y-full transition-transform duration-300 shadow-2xl hidden">
            <div class="w-12 h-1.5 bg-zinc-200 dark:bg-zinc-800 rounded-full mx-auto mt-4 mb-6"></div>
            <div class="px-6 pb-12">

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="app.openModal('task-modal')" class="group flex flex-col items-center justify-center p-5 bg-indigo-50 dark:bg-indigo-500/10 rounded-3xl border border-indigo-100 dark:border-indigo-500/20 hover:bg-indigo-100 transition-all active:scale-95">
                        <div class="w-14 h-14 bg-white dark:bg-indigo-600/20 rounded-2xl flex items-center justify-center shadow-sm mb-3 group-hover:scale-110 transition-transform">
                            <i data-lucide="calendar-plus" class="text-primary w-7 h-7"></i>
                        </div>
                        <span class="text-sm font-semibold text-zinc-700 dark:text-zinc-300">Jadwal</span>

                    <button onclick="app.openModal('habit-modal')" class="group flex flex-col items-center justify-center p-5 bg-emerald-50 dark:bg-emerald-500/10 rounded-3xl border border-emerald-100 dark:border-emerald-500/20 hover:bg-emerald-100 transition-all active:scale-95">

                        </div>

                    </button>

            </div>
        </div>

        <!-- Task Form Modal -->
        <div id="task-modal" class="fixed inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center z-50 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white dark:bg-darkCard w-full sm:max-w-md rounded-t-[2rem] sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto transform sm:scale-95 transition-transform duration-300 p-6 absolute bottom-0 sm:relative">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold" id="task-modal-title">Tambah Jadwal</h3>
                    <button class="close-modal-btn p-2 bg-zinc-100 dark:bg-zinc-800/50 rounded-full text-zinc-500 hover:text-zinc-800 dark:hover:text-white transition-colors">

                <form id="task-form" class="space-y-4">
                    <input type="hidden" id="task-id">

                        <input type="text" id="task-title" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3.5 outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all font-medium" placeholder="Cth: Meeting Tim, Olahraga">
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 uppercase tracking-wide">Mulai Dari</label>
                            <input type="date" id="task-date" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3.5 outline-none focus:border-primary transition-all text-sm font-medium">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 uppercase tracking-wide">Pengulangan</label>
                            <select id="task-repeat" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3.5 outline-none focus:border-primary transition-all text-sm font-medium appearance-none">
                                <option value="none">Tidak Berulang</option>
                                <option value="daily">Setiap Hari</option>
                                <option value="weekly">Setiap Minggu</option>
                                <option value="monthly">Setiap Bulan</option>
                            </select>

                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 uppercase tracking-wide">Jam Mulai</label>
                            <input type="time" id="task-start-time" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3.5 outline-none focus:border-primary transition-all text-sm font-medium">
                        </div>

                            <label class="block text-xs font-semibold text-zinc-500 dark:text-zinc-400 mb-1.5 uppercase tracking-wide">Kategori</label>
                            <select id="task-category" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3.5 outline-none focus:border-primary transition-all text-sm font-medium appearance-none">
                                <option value="personal">Pribadi</option>
                                <option value="work">Pekerjaan</option>
                                <option value="health">Kesehatan</option>
                                <option value="learning">Belajar</option>
                            </select>
                        </div>
                    </div>
                    <div>

                        <textarea id="task-desc" rows="2" class="w-full bg-zinc-50 dark:bg-zinc-900/50 border border-zinc-200 dark:border-zinc-800 rounded-2xl px-4 py-3 outline-none focus:border-primary transition-all resize-none text-sm font-medium" placeholder="Tambahkan detail..."></textarea>
                    </div>
                    <div class="pt-4">

                    </div>

            </div>

        <!-- Habit Form Modal -->

        <!-- Confirmation Dialog -->
        <div id="confirm-dialog" class="fixed inset-0 z-[60] flex items-center justify-center hidden opacity-0 transition-all duration-300">
            <div class="absolute inset-0 bg-black/60 backdrop-blur-sm confirm-overlay"></div>
            <div class="bg-white dark:bg-darkCard w-11/12 max-w-[320px] rounded-[2rem] p-6 relative z-10 transform scale-95 transition-transform shadow-2xl text-center border border-zinc-100 dark:border-zinc-800">

        <!-- Toast Notification Container -->

    <script>
        const CONFIG = {
            GAS_URL: 'https://script.google.com/macros/s/AKfycbzrC0YAoecga039FYAZ9Dkn6zE68tlcJL5JTCX_ZnUfrwJfvXSBc0kNgAkrvFLptbq7Tg/exec'
        };

        const StorageKey = 'myScheduleApp_data';
        const defaultState = {
            settings: { theme: 'system', userName: 'Pengguna' },
            tasks: [], // { id, title, date, repeat, startTime, category, desc, completedDates: [] }
            habits: [], 
            lastUpdated: 0 
        };

        class Store {
            constructor() {
                this.data = this.load();
                this.syncTimer = null;
            }

            load() {
                const stored = localStorage.getItem(StorageKey);
                let data = stored ? { ...defaultState, ...JSON.parse(stored) } : JSON.parse(JSON.stringify(defaultState));
                
                // MIGRASI OTOMATIS: Tambahkan properti repeat & completedDates ke data lama
                data.tasks.forEach(t => {
                    if(!t.repeat) t.repeat = 'none';
                    if(!t.completedDates) {
                        t.completedDates = [];
                        if(t.completed) t.completedDates.push(t.date); // pindahkan status selesai lama
                    }
                });
                return data;
            }

            save() {
                this.data.lastUpdated = Date.now();
                localStorage.setItem(StorageKey, JSON.stringify(this.data));
                
                if (CONFIG.GAS_URL && CONFIG.GAS_URL !== 'MASUKKAN_URL_GAS_ANDA_DISINI') {
                    clearTimeout(this.syncTimer);
                    this.syncTimer = setTimeout(() => {
                        fetch(CONFIG.GAS_URL, {
                            method: 'POST', mode: 'no-cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(this.data)
                        }).catch(e => console.log('Sync background error', e));
                    }, 1500); 
                }
            }

            // Tasks
            addTask(task) {
                task.id = 't_' + Date.now().toString(36);
                task.completedDates = [];
                this.data.tasks.push(task);
                this.save();
            }

            updateTask(updatedTask) {
                const index = this.data.tasks.findIndex(t => t.id === updatedTask.id);
                if (index !== -1) {
                    updatedTask.completedDates = this.data.tasks[index].completedDates; // Pertahankan history ceklis
                    this.data.tasks[index] = updatedTask;
                    this.save();
                }
            }

            deleteTask(id) {
                this.data.tasks = this.data.tasks.filter(t => t.id !== id);
                this.save();
            }

            toggleTask(id, dateStr) {
                const task = this.data.tasks.find(t => t.id === id);
                if (task) {
                    const idx = task.completedDates.indexOf(dateStr);
                    let isCompleted = false;
                    
                    if (idx === -1) {
                        task.completedDates.push(dateStr);
                        isCompleted = true;
                    } else {
                        task.completedDates.splice(idx, 1);
                    }
                    this.save();
                    return isCompleted;
                }
                return false;
            }

            getTasksByDate(dateStr) {
                return this.data.tasks
                    .filter(t => utils.isTaskOnDate(t, dateStr))
                    .sort((a, b) => (a.startTime || '00:00').localeCompare(b.startTime || '00:00'));
            }

            // Habits (Same logic as before)
            addHabit(habit) {
                habit.id = 'h_' + Date.now().toString(36);
                habit.history = {}; 
                this.data.habits.push(habit);
                this.save();
            }
            updateHabit(updatedHabit) {
                const index = this.data.habits.findIndex(h => h.id === updatedHabit.id);
                if (index !== -1) {
                    updatedHabit.history = this.data.habits[index].history;
                    this.data.habits[index] = updatedHabit;
                    this.save();
                }
            }
            deleteHabit(id) {
                this.data.habits = this.data.habits.filter(h => h.id !== id);
                this.save();
            }
            updateHabitProgress(id, dateStr, increment = 1) {
                const habit = this.data.habits.find(h => h.id === id);
                if (habit) {
                    const current = habit.history[dateStr] || 0;
                    let next = current + increment;
                    if (increment === 1 && current >= habit.target) next = 0;
                    habit.history[dateStr] = Math.max(0, next);
                    this.save();
                    return { progress: habit.history[dateStr], completed: habit.history[dateStr] >= habit.target };
                }
            }
        }

        const store = new Store();
        window.store = store;

        const utils = {
            getTodayStr: () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },
            formatDateId: (d) => {
                 const date = new Date(d);
                 return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            },
            formatDateDisplay: (dateStr) => {
                return new Date(dateStr).toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });

            getGreeting: () => {
                const hour = new Date().getHours();
                if (hour < 11) return 'Selamat Pagi 🌅';
                if (hour < 15) return 'Selamat Siang ☀️';
                if (hour < 19) return 'Selamat Sore 🌇';
                return 'Selamat Malam 🌙';

            getCategoryColor: (cat) => {
                const colors = {
                    'personal': 'bg-pink-100 text-pink-700 dark:bg-pink-500/20 dark:text-pink-300',
                    'work': 'bg-blue-100 text-blue-700 dark:bg-blue-500/20 dark:text-blue-300',
                    'health': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/20 dark:text-emerald-300',
                    'learning': 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300'
                };
                return colors[cat] || colors['personal'];
            },
            getHabitColorHex: (colorName) => {
                const colors = { 'blue': '#3b82f6', 'emerald': '#10b981', 'pink': '#ec4899', 'amber': '#f59e0b', 'purple': '#8b5cf6', 'red': '#ef4444' };
                return colors[colorName] || colors['blue'];
            },
            getRepeatLabel: (repeat) => {
                const lbl = { 'daily': 'Harian', 'weekly': 'Mingguan', 'monthly': 'Bulanan' };
                return lbl[repeat] || '';
            },
            isTaskOnDate: (task, checkDateStr) => {
                if (task.date === checkDateStr) return true; 
                if (task.date > checkDateStr) return false; // belum mulai
                
                const tDate = new Date(task.date);
                const cDate = new Date(checkDateStr);
                
                if (task.repeat === 'daily') return true;
                if (task.repeat === 'weekly') return tDate.getDay() === cDate.getDay();
                if (task.repeat === 'monthly') return tDate.getDate() === cDate.getDate();
                return false;
            },
            calculateStreak: (habit) => {
                let streak = 0, tempBest = 0, currentRun = 0, prevDate = null;
                
                // Curr streak
                let checkDate = new Date();
                let dateStr = utils.formatDateId(checkDate);
                if (!habit.history[dateStr] || habit.history[dateStr] < habit.target) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    dateStr = utils.formatDateId(checkDate);
                }
                while(habit.history[dateStr] >= habit.target) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                    dateStr = utils.formatDateId(checkDate);
                }

                // Best Streak
                let sortedAllDates = Object.keys(habit.history).sort((a,b) => new Date(a) - new Date(b));
                sortedAllDates.forEach(d => {
                    if (habit.history[d] >= habit.target) {
                        const currD = new Date(d);
                        if (!prevDate) currentRun = 1;
                        else {
                            const diff = Math.round((currD - prevDate) / (1000 * 60 * 60 * 24));
                            if (diff === 1) currentRun++; else currentRun = 1;
                        }
                        tempBest = Math.max(tempBest, currentRun);
                        prevDate = currD;
                    }
                });
                return { current: streak, best: tempBest };

                        const isDone = currentProgress >= habit.target;
                        const colorHex = utils.getHabitColorHex(habit.color);
                        const streak = utils.calculateStreak(habit);

                        html += `
                            <div class="glass-card p-5 rounded-3xl relative overflow-hidden transition-all hover:shadow-md group">
                                <div class="absolute top-0 left-0 w-1.5 h-full" style="background-color: ${colorHex}"></div>
                                
                                <div class="flex justify-between items-start pl-2">
                                    <div class="flex items-center gap-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center" style="background-color: ${colorHex}20; color: ${colorHex}">
                                            <i data-lucide="${habit.icon}" class="w-6 h-6"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-zinc-800 dark:text-zinc-100 text-base">${habit.title}</h3>
                                            <div class="flex items-center gap-2 mt-0.5 text-xs font-semibold text-zinc-500">
                                                <span class="flex items-center gap-1 text-orange-500"><i data-lucide="flame" class="w-3.5 h-3.5"></i> ${streak.current} hari</span>
                                                <span class="w-1 h-1 rounded-full bg-zinc-300 dark:bg-zinc-700"></span>
                                                <span>Best: ${streak.best}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="hidden group-hover:flex gap-1 animate-fade-in">
                                        <button onclick="app.editHabit('${habit.id}')" class="p-2 text-zinc-400 hover:text-primary transition-colors"><i data-lucide="edit-2" class="w-4 h-4"></i></button>
                                        <button onclick="app.deleteHabitDirect('${habit.id}')" class="p-2 text-zinc-400 hover:text-red-500 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                    </div>
                                </div>

                                <div class="mt-5 flex items-center justify-between pl-2">
                                    <div class="flex-1 mr-5">
                                        <div class="flex justify-between text-xs font-bold text-zinc-500 mb-2 uppercase tracking-wide">
                                            <span>Progress</span>
                                            <span>${currentProgress} / ${habit.target} ${habit.unit}</span>
                                        </div>
                                        <div class="h-2.5 w-full bg-zinc-100 dark:bg-zinc-800/80 rounded-full overflow-hidden">
                                            <div class="h-full rounded-full transition-all duration-500" style="width: ${Math.min(100, (currentProgress/habit.target)*100)}%; background-color: ${colorHex}"></div>
                                        </div>
                                    </div>
                                    <div class="flex gap-2">
                                        ${currentProgress > 0 ? `
                                        <button onclick="app.decrementHabit('${habit.id}')" class="w-10 h-10 rounded-2xl flex items-center justify-center transition-transform active:scale-90 shadow-sm border-2 border-zinc-200 dark:border-zinc-700 text-zinc-400 hover:border-zinc-300">
                                            <i data-lucide="minus" class="w-5 h-5"></i>
                                        </button>
                                        ` : ''}
                                        <button onclick="app.incrementHabit('${habit.id}')" class="w-10 h-10 rounded-2xl flex items-center justify-center transition-transform active:scale-90 shadow-sm border-2 ${isDone ? 'border-transparent text-white' : 'border-zinc-200 dark:border-zinc-700 text-zinc-400 hover:border-zinc-300'}" style="${isDone ? `background-color: ${colorHex}` : ''}">
                                            <i data-lucide="${isDone ? 'check' : 'plus'}" class="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
                return html;
            },

            settings: () => {
                const s = store.data.settings;
                return `
                    <div class="px-6 pt-12 pb-24">
                        <div class="flex items-center gap-4 mb-8">
                            <button onclick="app.navigate('home')" class="w-10 h-10 rounded-2xl bg-zinc-200/50 dark:bg-zinc-800/50 flex items-center justify-center text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 transition-colors">
                                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            </button>
                            <h1 class="text-2xl font-extrabold tracking-tight">Pengaturan</h1>
                        </div>

                        <div class="space-y-8">
                            <div>
                                <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3 px-2">Tampilan</h3>
                                <div class="glass-card rounded-3xl overflow-hidden shadow-sm">
                                    <div class="flex items-center justify-between p-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-2xl bg-zinc-100 dark:bg-zinc-800/80 flex items-center justify-center"><i data-lucide="moon" class="w-5 h-5 text-zinc-600 dark:text-zinc-300"></i></div>
                                            <span class="font-bold">Tema Gelap</span>
                                        </div>
                                        <select onchange="app.changeTheme(this.value)" class="bg-transparent text-sm font-bold text-zinc-500 outline-none text-right appearance-none cursor-pointer">
                                            <option value="light" ${s.theme==='light'?'selected':''}>Light</option>
                                            <option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option>
                                            <option value="system" ${s.theme==='system'?'selected':''}>System</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-bold text-zinc-400 uppercase tracking-wider mb-3 px-2">Data Cloud</h3>
                                <div class="glass-card rounded-3xl overflow-hidden shadow-sm">
                                    <button onclick="app.autoLoadFromCloud(true)" class="w-full flex items-center justify-between p-4 border-b border-zinc-100 dark:border-zinc-800/50 hover:bg-zinc-50 dark:hover:bg-zinc-800/30 transition-colors">
                                        <div class="flex items-center gap-3 text-zinc-700 dark:text-zinc-300">
                                            <div class="w-10 h-10 rounded-2xl bg-blue-50 dark:bg-blue-500/10 flex items-center justify-center text-blue-500"><i data-lucide="download-cloud" class="w-5 h-5"></i></div>
                                            <span class="font-bold">Download Data Cloud</span>
                                        </div>
                                    </button>
                                    <button onclick="app.clearData()" class="w-full flex items-center justify-between p-4 hover:bg-red-50 dark:hover:bg-red-500/10 transition-colors group">
                                        <div class="flex items-center gap-3 text-red-500">
                                            <div class="w-10 h-10 rounded-2xl bg-red-50 dark:bg-red-500/10 flex items-center justify-center"><i data-lucide="trash-2" class="w-5 h-5"></i></div>
                                            <span class="font-bold">Hapus Semua Data</span>
                                        </div>
                                    </button>
                                </div>
                                <p class="text-[10px] text-zinc-400 text-center mt-4 font-medium">Auto-sync di background selalu aktif setiap kali ada perubahan.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        };

        // --- STREAMING_CHUNK:App Core controller... ---
        const app = {
            currentView: 'home',
            
            init: async () => {
                ui.applyTheme();
                app.setupNav();
                app.setupModals();
                app.setupForms();
                app.setupIconSelectors();
                
                if (CONFIG.GAS_URL && CONFIG.GAS_URL !== 'MASUKKAN_URL_GAS_ANDA_DISINI') {
                    app.autoLoadFromCloud();
                }

                app.navigate('home');
            },

            navigate: (viewName) => {
                const content = document.getElementById('main-content');
                content.style.opacity = '0';
                
                setTimeout(() => {
                    try { content.innerHTML = views[viewName](); } 
                    catch (err) { content.innerHTML = `<div class="p-8 text-center text-red-500 font-bold">Error loading view.</div>`; }
                    
                    app.currentView = viewName;
                    
                    // Update Nav
                    document.querySelectorAll('.nav-item').forEach(el => {
                        const icon = el.querySelector('i, svg');
                        const span = el.querySelector('span');
                        if (el.dataset.target === viewName) {
                            el.classList.replace('text-zinc-400', 'text-primary');
                            el.classList.replace('dark:text-zinc-500', 'text-primary');
                            if(span) span.classList.add('font-bold');
                            if(icon) { icon.classList.add('animate-pop'); setTimeout(() => icon.classList.remove('animate-pop'), 300); }
                        } else {
                            el.classList.remove('text-primary');
                            el.classList.add('text-zinc-400', 'dark:text-zinc-500');
                            if(span) span.classList.remove('font-bold');
                        }
                    });

                    const navContainer = document.getElementById('bottom-nav-container');
                    if(viewName === 'settings') navContainer.classList.add('translate-y-32');
                    else navContainer.classList.remove('translate-y-32');

                    if(window.lucide) lucide.createIcons();
                    
                    content.style.opacity = '1';
                }, 150);
            },

            setupNav: () => {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget.dataset.target;
                        if(app.currentView !== target) app.navigate(target);
                    });
                });
            },

            setupModals: () => {
                const overlay = document.getElementById('overlay');
                const quickAdd = document.getElementById('quick-add-sheet');
                const fab = document.getElementById('fab-btn');

                const closeAll = () => {
                    overlay.classList.add('opacity-0');
                    quickAdd.classList.add('translate-y-full');
                    
                    ['task-modal', 'habit-modal'].forEach(id => {
                        const m = document.getElementById(id);
                        m.classList.add('opacity-0');
                        m.children[0].classList.add('sm:scale-95'); 
                        if(window.innerWidth < 640) m.children[0].classList.add('translate-y-full');
                        setTimeout(() => m.classList.add('hidden'), 300);
                    });
                    setTimeout(() => { overlay.classList.add('hidden'); quickAdd.classList.add('hidden'); }, 300);
                };

                fab.addEventListener('click', () => {
                    overlay.classList.remove('hidden'); quickAdd.classList.remove('hidden');
                    setTimeout(() => { overlay.classList.remove('opacity-0'); quickAdd.classList.remove('translate-y-full'); }, 10);
                });
                overlay.addEventListener('click', closeAll);
                document.querySelectorAll('.close-modal-btn').forEach(b => b.addEventListener('click', closeAll));
                app.closeModals = closeAll;
            },

            openModal: (modalId, dataId = null, defaultDate = null) => {
                document.getElementById('quick-add-sheet').classList.add('translate-y-full');
                const modal = document.getElementById(modalId);
                const overlay = document.getElementById('overlay');
                
                overlay.classList.remove('hidden'); modal.classList.remove('hidden');
                setTimeout(() => {
                    overlay.classList.remove('opacity-0'); modal.classList.remove('opacity-0');
                    modal.children[0].classList.remove('sm:scale-95');
                    if(window.innerWidth < 640) modal.children[0].classList.remove('translate-y-full');
                }, 10);

                if (modalId === 'task-modal') {
                    const form = document.getElementById('task-form');
                    form.reset();
                    document.getElementById('task-id').value = '';
                    document.getElementById('task-date').value = defaultDate || utils.getTodayStr();
                    document.getElementById('task-repeat').value = 'none';
                    document.getElementById('task-start-time').value = `${String(new Date().getHours()).padStart(2,'0')}:00`;
                    document.getElementById('task-modal-title').textContent = 'Tambah Jadwal';

                    if (dataId) {
                        const task = store.data.tasks.find(t => t.id === dataId);
                        if(task) {
                            document.getElementById('task-id').value = task.id;
                            document.getElementById('task-title').value = task.title;
                            document.getElementById('task-date').value = task.date;
                            document.getElementById('task-repeat').value = task.repeat || 'none';
                            document.getElementById('task-category').value = task.category;
                            document.getElementById('task-start-time').value = task.startTime;
                            document.getElementById('task-desc').value = task.desc;
                            document.getElementById('task-modal-title').textContent = 'Edit Jadwal';
                        }
                    }
                } 
                else if (modalId === 'habit-modal') {
                    document.getElementById('habit-form').reset();
                    document.getElementById('habit-id').value = '';
                    app.selectIcon('check-circle'); app.selectColor('blue');
                    document.getElementById('habit-modal-title').textContent = 'Tambah Habit';

                    if (dataId) {
                        const habit = store.data.habits.find(h => h.id === dataId);
                        if(habit) {
                            document.getElementById('habit-id').value = habit.id;
                            document.getElementById('habit-title').value = habit.title;
                            document.getElementById('habit-target').value = habit.target;
                            document.getElementById('habit-unit').value = habit.unit;
                            app.selectIcon(habit.icon); app.selectColor(habit.color);
                            document.getElementById('habit-modal-title').textContent = 'Edit Habit';
                        }
                    }
                }
            },

            setupForms: () => {
                document.getElementById('task-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const titleInput = document.getElementById('task-title').value.trim();
                    if (!titleInput) { ui.toast('Nama Aktivitas tidak boleh kosong!', 'error'); return; }

                    const id = document.getElementById('task-id').value;
                    const taskData = {
                        title: titleInput,
                        date: document.getElementById('task-date').value || utils.getTodayStr(),
                        repeat: document.getElementById('task-repeat').value || 'none',
                        category: document.getElementById('task-category').value || 'personal',
                        startTime: document.getElementById('task-start-time').value || '00:00',
                        desc: document.getElementById('task-desc').value || ''
                    };

                    if (id) { taskData.id = id; store.updateTask(taskData); ui.toast('Jadwal diperbarui'); } 
                    else { store.addTask(taskData); ui.toast('Jadwal ditambahkan'); }
                    
                    app.closeModals(); app.navigate(app.currentView);
                });

                document.getElementById('habit-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    const titleInput = document.getElementById('habit-title').value.trim();
                    if (!titleInput) { ui.toast('Nama Habit tidak boleh kosong!', 'error'); return; }

                    const id = document.getElementById('habit-id').value;
                    const habitData = {
                        title: titleInput,
                        target: parseInt(document.getElementById('habit-target').value) || 1,
                        unit: document.getElementById('habit-unit').value,
                        icon: document.getElementById('habit-icon').value,
                        color: document.getElementById('habit-color').value
                    };

                    if (id) { habitData.id = id; store.updateHabit(habitData); ui.toast('Habit diperbarui'); } 
                    else { store.addHabit(habitData); ui.toast('Habit ditambahkan'); }
                    
                    app.closeModals(); app.navigate(app.currentView);
                });
            },

            setupIconSelectors: () => {
                const icons = ['check-circle', 'droplet', 'book', 'dumbbell', 'moon', 'sun', 'coffee', 'heart', 'code', 'pen-tool', 'music', 'smile'];
                const colors = ['blue', 'emerald', 'pink', 'amber', 'purple', 'red'];
                
                const iconContainer = document.getElementById('icon-selector');
                icons.forEach(icon => {
                    const btn = document.createElement('button'); btn.type = 'button';
                    btn.className = 'p-3 rounded-2xl flex items-center justify-center border-2 border-transparent hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors icon-btn';
                    btn.dataset.icon = icon;
                    btn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 text-zinc-400"></i>`;
                    btn.onclick = () => app.selectIcon(icon);
                    iconContainer.appendChild(btn);
                });

                const colorContainer = document.getElementById('color-selector');
                colors.forEach(color => {
                    const btn = document.createElement('button'); btn.type = 'button';
                    btn.className = `w-10 h-10 rounded-2xl border-2 border-transparent flex items-center justify-center color-btn transition-transform`;
                    btn.style.backgroundColor = utils.getHabitColorHex(color);
                    btn.dataset.color = color;
                    btn.onclick = () => app.selectColor(color);
                    colorContainer.appendChild(btn);
                });
            },

            selectIcon: (iconName) => {
                document.getElementById('habit-icon').value = iconName;
                document.querySelectorAll('.icon-btn').forEach(btn => {
                    if (btn.dataset.icon === iconName) {
                        btn.classList.add('bg-indigo-50', 'dark:bg-indigo-500/10', 'border-indigo-200', 'dark:border-indigo-500/30');
                        btn.querySelector('i').classList.replace('text-zinc-400', 'text-primary');
                    } else {
                        btn.classList.remove('bg-indigo-50', 'dark:bg-indigo-500/10', 'border-indigo-200', 'dark:border-indigo-500/30');
                        btn.querySelector('i').classList.replace('text-primary', 'text-zinc-400');
                    }
                });
            },

            selectColor: (colorName) => {
                document.getElementById('habit-color').value = colorName;
                document.querySelectorAll('.color-btn').forEach(btn => {
                    if (btn.dataset.color === colorName) btn.classList.add('scale-110', 'ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-darkCard', 'ring-zinc-400');
                    else btn.classList.remove('scale-110', 'ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-darkCard', 'ring-zinc-400');
                });
            },

            toggleTaskUI: (id, dateStr, event) => {
                const isCompleted = store.toggleTask(id, dateStr);
                const card = event.target.closest('.glass-card');
                const title = card.querySelector('h4');
                
                if (isCompleted) title.classList.add('line-through', 'text-zinc-400', 'dark:text-zinc-500');
                else title.classList.remove('line-through', 'text-zinc-400', 'dark:text-zinc-500');
                
                if(app.currentView === 'home') setTimeout(() => app.navigate(app.currentView), 300); 
            },

            editTask: (id) => app.openModal('task-modal', id),
            deleteTaskDirect: (id) => {
                ui.confirm('Hapus Jadwal', `Yakin ingin menghapus jadwal ini?`, () => {
                    store.deleteTask(id); app.navigate(app.currentView); ui.toast('Jadwal dihapus');
                });
            },

            editHabit: (id) => app.openModal('habit-modal', id),
            deleteHabitDirect: (id) => {
                ui.confirm('Hapus Habit', `Progress habit ini akan hilang. Lanjutkan?`, () => {
                    store.deleteHabit(id); app.navigate(app.currentView); ui.toast('Habit dihapus');
                });
            },
            incrementHabit: (id) => {
                const res = store.updateHabitProgress(id, utils.getTodayStr());
                app.navigate(app.currentView);
                if (res.completed && res.progress === store.data.habits.find(h=>h.id===id).target) ui.toast('Target tercapai! 🎉');
            },
            decrementHabit: (id) => { store.updateHabitProgress(id, utils.getTodayStr(), -1); app.navigate(app.currentView); },

            changeTheme: (themeStr) => { store.data.settings.theme = themeStr; store.save(); ui.applyTheme(); },
            clearData: () => {
                ui.confirm('Hapus Semua Data', 'Semua jadwal dan habit akan terhapus.', () => {
                    localStorage.removeItem(StorageKey); location.reload();
                });
            },

            autoLoadFromCloud: async (forceNotify = false) => {
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const cloudData = await response.json();
                    
                    if (cloudData && cloudData.tasks && cloudData.settings) {
                        const localUpdate = store.data.lastUpdated || 0;
                        const cloudUpdate = cloudData.lastUpdated || 0;
                        
                        // Menimpa jika data cloud lebih baru ATAU jika user klik tombol manual
                        if (cloudUpdate > localUpdate || localUpdate === 0 || forceNotify) {
                            store.data = cloudData;
                            localStorage.setItem(StorageKey, JSON.stringify(store.data));
                            ui.applyTheme();
                            if(app.currentView) app.navigate(app.currentView);
                            if(forceNotify) ui.toast('Data berhasil didownload dari Cloud');
                        } else if(forceNotify) {
                            ui.toast('Data lokal Anda sudah yang paling baru.');
                        }
                    }
                } catch (error) {
                    console.log("Cloud Error", error);
                    if(forceNotify) ui.toast('Gagal konek ke database.', 'error');
                }
            }
        };

        window.app = app;
        window.views = views;

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
            if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (store.data.settings.theme === 'system') ui.applyTheme();
            });
        });
    </script>
</body>
</html>
