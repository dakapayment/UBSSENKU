<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Schedule</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        primaryLight: '#818CF8', // Indigo 400
                        darkBg: '#0f172a', // Slate 900
                        darkCard: '#1e293b', // Slate 800
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'fade-in': 'fadeIn 0.2s ease-out',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        pop: {
                            '0%': { transform: 'scale(0.95)' },
                            '50%': { transform: 'scale(1.05)' },
                            '100%': { transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #475569;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none; /* Prevent pull-to-refresh on mobile */
        }

        /* Hide scrollbar for main content area to look like native app */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth transitions */
        .transition-all-smooth {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Safe Area untuk Mobile (iOS/Android) */
        .pb-safe {
            padding-bottom: 0.75rem; /* fallback */
        }
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe {
                padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
            }
        }

        /* Checkbox custom styling */
        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.5em;
            height: 1.5em;
            border: 2px solid #cbd5e1;
            border-radius: 0.5em;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .dark .custom-checkbox {
            border-color: #475569;
        }
        
        .custom-checkbox::before {
            content: "";
            width: 0.8em;
            height: 0.8em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            background-color: white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #4F46E5;
            border-color: #4F46E5;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Glassmorphism for Bottom Nav */
        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(226, 232, 240, 0.6);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid rgba(30, 41, 59, 0.6);
        }

        /* Floating App Container for Desktop */
        @media (min-width: 640px) {
            body {
                background-color: #f1f5f9;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }
            .dark body {
                background-color: #020617;
            }
            #app-container {
                width: 100%;
                max-width: 420px;
                height: 90vh;
                max-height: 850px;
                border-radius: 2rem;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
                overflow: hidden;
                position: relative;
            }
        }
    </style>
</head>
<body class="bg-white dark:bg-darkBg text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div id="app-container" class="flex flex-col h-screen h-[100dvh] w-full relative bg-gray-50 dark:bg-darkBg overflow-hidden sm:overflow-visible">
        
        <!-- Main Content Area -->
        <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar pb-28 relative">
            <!-- Views will be injected here via JavaScript -->
        </main>

        <!-- Floating Action Button (FAB) -->
        <button id="fab-btn" class="fixed sm:absolute bottom-20 right-6 w-14 h-14 bg-primary hover:bg-indigo-700 text-white rounded-2xl shadow-lg shadow-indigo-200 dark:shadow-indigo-900/50 flex items-center justify-center transition-all-smooth z-40 active:scale-95">
            <i data-lucide="plus" class="w-7 h-7"></i>
        </button>

        <!-- Bottom Navigation -->
        <nav class="fixed sm:absolute bottom-0 w-full glass-nav z-30 px-6 py-3 pb-safe">
            <div class="flex justify-between items-center max-w-md mx-auto">
                <button class="nav-item flex flex-col items-center p-2 text-primary" data-target="home">
                    <i data-lucide="home" class="w-6 h-6 mb-1"></i>
                    <span class="text-[10px] font-medium">Home</span>
                </button>
                <button class="nav-item flex flex-col items-center p-2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" data-target="schedule">
                    <i data-lucide="calendar" class="w-6 h-6 mb-1"></i>
                    <span class="text-[10px] font-medium">Jadwal</span>
                </button>
                <div class="w-10"></div> <!-- Space for FAB -->
                <button class="nav-item flex flex-col items-center p-2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" data-target="habits">
                    <i data-lucide="check-circle-2" class="w-6 h-6 mb-1"></i>
                    <span class="text-[10px] font-medium">Habit</span>
                </button>
                <button class="nav-item flex flex-col items-center p-2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 transition-colors" data-target="stats">
                    <i data-lucide="bar-chart-2" class="w-6 h-6 mb-1"></i>
                    <span class="text-[10px] font-medium">Statistik</span>
                </button>
            </div>
        </nav>

        <!-- Overlay -->
        <div id="overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300"></div>

        <!-- Quick Add Bottom Sheet -->
        <div id="quick-add-sheet" class="fixed bottom-0 left-0 right-0 sm:absolute sm:bottom-0 bg-white dark:bg-darkCard rounded-t-3xl z-50 transform translate-y-full transition-transform duration-300 shadow-2xl hidden">
            <div class="w-12 h-1.5 bg-gray-300 dark:bg-gray-600 rounded-full mx-auto mt-3 mb-6"></div>
            <div class="px-6 pb-10">
                <h3 class="text-lg font-semibold mb-4 text-gray-800 dark:text-white">Buat Baru</h3>
                <div class="grid grid-cols-2 gap-4">
                    <button onclick="app.openModal('task-modal')" class="flex flex-col items-center justify-center p-4 bg-indigo-50 dark:bg-indigo-900/20 rounded-2xl border border-indigo-100 dark:border-indigo-800/50 hover:bg-indigo-100 transition-colors">
                        <div class="w-12 h-12 bg-white dark:bg-indigo-800 rounded-full flex items-center justify-center shadow-sm mb-3">
                            <i data-lucide="calendar-plus" class="text-primary w-6 h-6"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Jadwal</span>
                    </button>
                    <button onclick="app.openModal('habit-modal')" class="flex flex-col items-center justify-center p-4 bg-emerald-50 dark:bg-emerald-900/20 rounded-2xl border border-emerald-100 dark:border-emerald-800/50 hover:bg-emerald-100 transition-colors">
                        <div class="w-12 h-12 bg-white dark:bg-emerald-800 rounded-full flex items-center justify-center shadow-sm mb-3">
                            <i data-lucide="sparkles" class="text-emerald-500 w-6 h-6"></i>
                        </div>
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Habit</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Task Form Modal -->
        <div id="task-modal" class="fixed inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center z-50 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white dark:bg-darkCard w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto transform sm:scale-95 transition-transform duration-300 p-6 absolute bottom-0 sm:relative">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold" id="task-modal-title">Tambah Jadwal</h3>
                    <button class="close-modal-btn p-2 bg-gray-100 dark:bg-gray-800 rounded-full text-gray-500 hover:text-gray-800 dark:hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <form id="task-form" class="space-y-4">
                    <input type="hidden" id="task-id">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Nama Aktivitas</label>
                        <input type="text" id="task-title" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary dark:focus:border-primary transition-colors" placeholder="Cth: Meeting Tim, Olahraga">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Tanggal</label>
                            <input type="date" id="task-date" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Kategori</label>
                            <select id="task-category" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm appearance-none">
                                <option value="personal">Pribadi</option>
                                <option value="work">Pekerjaan</option>
                                <option value="health">Kesehatan</option>
                                <option value="learning">Belajar</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Mulai</label>
                            <input type="time" id="task-start-time" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Selesai</label>
                            <input type="time" id="task-end-time" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Catatan (Opsional)</label>
                        <textarea id="task-desc" rows="2" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors resize-none text-sm" placeholder="Tambahkan detail..."></textarea>
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-primary hover:bg-indigo-700 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-none transition-all active:scale-[0.98]">Simpan Jadwal</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Habit Form Modal -->
        <div id="habit-modal" class="fixed inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center z-50 hidden opacity-0 transition-opacity duration-300">
            <div class="bg-white dark:bg-darkCard w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl shadow-2xl max-h-[90vh] overflow-y-auto transform sm:scale-95 transition-transform duration-300 p-6 absolute bottom-0 sm:relative">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold" id="habit-modal-title">Tambah Habit</h3>
                    <button class="close-modal-btn p-2 bg-gray-100 dark:bg-gray-800 rounded-full text-gray-500 hover:text-gray-800 dark:hover:text-white">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <form id="habit-form" class="space-y-4">
                    <input type="hidden" id="habit-id">
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Nama Habit</label>
                        <input type="text" id="habit-title" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors" placeholder="Cth: Minum Air, Membaca 10 Hal">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Target (per hari)</label>
                            <input type="number" id="habit-target" min="1" value="1" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Satuan</label>
                            <input type="text" id="habit-unit" value="kali" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-4 py-3 outline-none focus:border-primary transition-colors text-sm" placeholder="kali, menit, gelas">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Pilih Ikon</label>
                        <div class="grid grid-cols-6 gap-2" id="icon-selector">
                            <!-- Icons injected via JS -->
                        </div>
                        <input type="hidden" id="habit-icon" value="check-circle">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Warna</label>
                        <div class="flex gap-3" id="color-selector">
                            <!-- Colors injected via JS -->
                        </div>
                        <input type="hidden" id="habit-color" value="blue">
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full bg-primary hover:bg-indigo-700 text-white font-medium py-3.5 rounded-xl shadow-lg shadow-indigo-200 dark:shadow-none transition-all active:scale-[0.98]">Simpan Habit</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Confirmation Dialog -->
        <div id="confirm-dialog" class="fixed inset-0 z-[60] flex items-center justify-center hidden opacity-0 transition-opacity">
            <div class="absolute inset-0 bg-black/50 backdrop-blur-sm confirm-overlay"></div>
            <div class="bg-white dark:bg-darkCard w-11/12 max-w-sm rounded-3xl p-6 relative z-10 transform scale-95 transition-transform shadow-2xl text-center">
                <div class="w-16 h-16 bg-red-100 dark:bg-red-900/30 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="alert-triangle" class="w-8 h-8"></i>
                </div>
                <h3 id="confirm-title" class="text-xl font-bold mb-2">Hapus Item?</h3>
                <p id="confirm-message" class="text-gray-500 dark:text-gray-400 text-sm mb-6">Tindakan ini tidak dapat dibatalkan.</p>
                <div class="flex gap-3">
                    <button id="confirm-cancel" class="flex-1 py-3 bg-gray-100 dark:bg-gray-800 text-gray-700 dark:text-gray-200 rounded-xl font-medium hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">Batal</button>
                    <button id="confirm-ok" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-medium hover:bg-red-600 transition-colors shadow-lg shadow-red-200 dark:shadow-none">Hapus</button>
                </div>
            </div>
        </div>

        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[70] flex flex-col gap-2 w-max max-w-[90%] pointer-events-none"></div>

    </div>

    <script>
        // --- KONFIGURASI DATABASE ONLINE ---
        const CONFIG = {
            // Wajib: Paste URL Web App Google Apps Script Anda di dalam tanda kutip di bawah ini!
            GAS_URL: 'https://script.google.com/macros/s/AKfycbzrC0YAoecga039FYAZ9Dkn6zE68tlcJL5JTCX_ZnUfrwJfvXSBc0kNgAkrvFLptbq7Tg/exec'
        };

        // --- DATA & STATE MANAGEMENT ---
        const StorageKey = 'myScheduleApp_data';
        
        const defaultState = {
            settings: {
                theme: 'system', // 'light', 'dark', 'system'
                userName: 'Pengguna'
            },
            tasks: [], // { id, title, date (YYYY-MM-DD), startTime, endTime, category, desc, completed }
            habits: [] // { id, title, target, unit, icon, color, history: { 'YYYY-MM-DD': count } }
        };

        class Store {
            constructor() {
                this.data = this.load();
                this.syncTimer = null;
            }

            load() {
                const stored = localStorage.getItem(StorageKey);
                return stored ? { ...defaultState, ...JSON.parse(stored) } : JSON.parse(JSON.stringify(defaultState));
            }

            save() {
                // Simpan lokal agar UI langsung merespons dengan cepat (tanpa loading)
                localStorage.setItem(StorageKey, JSON.stringify(this.data));
                
                // Auto-sync ke Google Sheets di background (Database Online Otomatis)
                if (CONFIG.GAS_URL && CONFIG.GAS_URL !== 'MASUKKAN_URL_GAS_ANDA_DISINI') {
                    clearTimeout(this.syncTimer);
                    // Tunggu 2 detik setelah user selesai klik/beraktivitas baru dikirim ke database
                    this.syncTimer = setTimeout(() => {
                        fetch(CONFIG.GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(this.data)
                        }).catch(e => console.error('Gagal auto-sync ke database', e));
                    }, 2000); 
                }
            }

            // Tasks
            addTask(task) {
                task.id = 't_' + Date.now().toString(36) + Math.random().toString(36).substr(2);
                task.completed = false;
                this.data.tasks.push(task);
                this.save();
                return task;
            }

            updateTask(updatedTask) {
                const index = this.data.tasks.findIndex(t => t.id === updatedTask.id);
                if (index !== -1) {
                    this.data.tasks[index] = { ...this.data.tasks[index], ...updatedTask };
                    this.save();
                }
            }

            deleteTask(id) {
                this.data.tasks = this.data.tasks.filter(t => t.id !== id);
                this.save();
            }

            toggleTask(id) {
                const task = this.data.tasks.find(t => t.id === id);
                if (task) {
                    task.completed = !task.completed;
                    this.save();
                    return task.completed;
                }
                return false;
            }

            getTasksByDate(dateStr) {
                return this.data.tasks
                    .filter(t => t.date === dateStr)
                    .sort((a, b) => a.startTime.localeCompare(b.startTime));
            }

            // Habits
            addHabit(habit) {
                habit.id = 'h_' + Date.now().toString(36);
                habit.history = {}; 
                habit.createdAt = utils.getTodayStr();
                this.data.habits.push(habit);
                this.save();
            }

            updateHabit(updatedHabit) {
                const index = this.data.habits.findIndex(h => h.id === updatedHabit.id);
                if (index !== -1) {
                    updatedHabit.history = this.data.habits[index].history;
                    this.data.habits[index] = updatedHabit;
                    this.save();
                }
            }

            deleteHabit(id) {
                this.data.habits = this.data.habits.filter(h => h.id !== id);
                this.save();
            }

            updateHabitProgress(id, dateStr, increment = 1) {
                const habit = this.data.habits.find(h => h.id === id);
                if (habit) {
                    const current = habit.history[dateStr] || 0;
                    let next = current + increment;
                    
                    if (increment === 1 && current >= habit.target) {
                        next = 0; // Reset
                    }
                    
                    habit.history[dateStr] = Math.max(0, next);
                    this.save();
                    return { progress: habit.history[dateStr], completed: habit.history[dateStr] >= habit.target };
                }
            }
        }

        const store = new Store();

        // Mencegah error "not defined" pada HTML inline onclick dengan mengekspos ke global window
        window.store = store;

        // --- STREAMING_CHUNK:Defining utility functions... ---
        const utils = {
            getTodayStr: () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            },
            formatDateId: (d) => {
                 const date = new Date(d);
                 return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            },
            formatDateDisplay: (dateStr) => {
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                const d = new Date(dateStr);
                return d.toLocaleDateString('id-ID', options);
            },
            getGreeting: () => {
                const hour = new Date().getHours();
                if (hour < 11) return 'Selamat pagi 🌅';
                if (hour < 15) return 'Selamat siang ☀️';
                if (hour < 19) return 'Selamat sore 🌇';
                return 'Selamat malam 🌙';
            },
            getCategoryColor: (cat) => {
                const colors = {
                    'personal': 'bg-pink-100 text-pink-700 dark:bg-pink-900/30 dark:text-pink-400',
                    'work': 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400',
                    'health': 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:text-emerald-400',
                    'learning': 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-400'
                };
                return colors[cat] || colors['personal'];
            },
            getHabitColorHex: (colorName) => {
                const colors = {
                    'blue': '#3b82f6', 'emerald': '#10b981', 'pink': '#ec4899',
                    'amber': '#f59e0b', 'purple': '#8b5cf6', 'red': '#ef4444'
                };
                return colors[colorName] || colors['blue'];
            },
            calculateStreak: (habit) => {
                let streak = 0;
                let dates = Object.keys(habit.history)
                                .filter(d => habit.history[d] >= habit.target)
                                .sort((a,b) => new Date(b) - new Date(a));
                
                if (dates.length === 0) return { current: 0, best: 0 };

                let checkDate = new Date();
                let dateStr = utils.formatDateId(checkDate);
                
                if (!habit.history[dateStr] || habit.history[dateStr] < habit.target) {
                    checkDate.setDate(checkDate.getDate() - 1);
                    dateStr = utils.formatDateId(checkDate);
                }

                while(habit.history[dateStr] >= habit.target) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                    dateStr = utils.formatDateId(checkDate);
                }

                let sortedAllDates = Object.keys(habit.history).sort((a,b) => new Date(a) - new Date(b));
                let tempBest = 0;
                let currentRun = 0;
                let prevDate = null;

                sortedAllDates.forEach(d => {
                    if (habit.history[d] >= habit.target) {
                        const currD = new Date(d);
                        if (!prevDate) {
                            currentRun = 1;
                        } else {
                            const diff = Math.round((currD - prevDate) / (1000 * 60 * 60 * 24));
                            if (diff === 1) currentRun++;
                            else currentRun = 1;
                        }
                        tempBest = Math.max(tempBest, currentRun);
                        prevDate = currD;
                    }
                });

                return { current: streak, best: tempBest };
            }

                            labels.push(d.toLocaleDateString('id-ID', {weekday:'short'}));
                            
                            const dStr = utils.formatDateId(d);
                            const doneCount = store.getTasksByDate(dStr).filter(t => t.completed).length;
                            data.push(doneCount);
                        }

                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Tugas Selesai',
                                    data: data,
                                    backgroundColor: '#4F46E5',
                                    borderRadius: 6,
                                    barThickness: 12
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } },
                                scales: {
                                    y: { beginAtZero: true, ticks: { stepSize: 1, color: '#9ca3af' }, grid: { color: 'rgba(156, 163, 175, 0.1)' } },
                                    x: { ticks: { color: '#9ca3af' }, grid: { display: false } }
                                }
                            }
                        });
                    }
                }, 100);

                return html;
            },

            settings: () => {
                const s = store.data.settings;
                let html = `
                    <div class="px-6 pt-12 pb-6">
                        <div class="flex items-center gap-3 mb-8">
                            <button onclick="app.navigate('home')" class="p-2 -ml-2 text-gray-500 hover:text-gray-800 dark:hover:text-white transition-colors">
                                <i data-lucide="arrow-left" class="w-6 h-6"></i>
                            </button>
                            <h1 class="text-2xl font-bold tracking-tight">Pengaturan</h1>
                        </div>

                        <div class="space-y-6">
                            <div>
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">Database Status</h3>
                                <div class="bg-white dark:bg-darkCard rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm p-4 flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-full bg-emerald-50 dark:bg-emerald-900/30 flex items-center justify-center text-emerald-500 shrink-0">
                                        <i data-lucide="cloud-lightning" class="w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-sm text-gray-800 dark:text-white">Online Database Aktif</h4>
                                        <p class="text-xs text-gray-500 mt-0.5">Semua perubahan Anda kini otomatis tersimpan ke Google Sheets secara real-time.</p>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">Tampilan</h3>
                                <div class="bg-white dark:bg-darkCard rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden">
                                    <div class="flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800">
                                        <div class="flex items-center gap-3">
                                            <div class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-700 flex items-center justify-center"><i data-lucide="moon" class="w-4 h-4 text-gray-600 dark:text-gray-300"></i></div>
                                            <span class="font-medium">Tema Gelap</span>
                                        </div>
                                        <select onchange="app.changeTheme(this.value)" class="bg-transparent text-sm font-medium text-gray-500 outline-none text-right appearance-none cursor-pointer">
                                            <option value="light" ${s.theme==='light'?'selected':''}>Light</option>
                                            <option value="dark" ${s.theme==='dark'?'selected':''}>Dark</option>
                                            <option value="system" ${s.theme==='system'?'selected':''}>System</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3 px-2">Data</h3>
                                <div class="bg-white dark:bg-darkCard rounded-3xl border border-gray-100 dark:border-gray-800 shadow-sm overflow-hidden">
                                    <button onclick="app.exportData()" class="w-full flex items-center justify-between p-4 border-b border-gray-100 dark:border-gray-800 hover:bg-gray-50 dark:hover:bg-gray-800/50 transition-colors">
                                        <div class="flex items-center gap-3 text-gray-700 dark:text-gray-300">
                                            <div class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-900/30 flex items-center justify-center text-blue-500"><i data-lucide="download" class="w-4 h-4"></i></div>
                                            <span class="font-medium">Backup Data</span>
                                        </div>
                                    </button>
                                    <button onclick="app.clearData()" class="w-full flex items-center justify-between p-4 hover:bg-red-50 dark:hover:bg-red-900/10 transition-colors group">
                                        <div class="flex items-center gap-3 text-red-500">
                                            <div class="w-8 h-8 rounded-full bg-red-50 dark:bg-red-900/30 flex items-center justify-center"><i data-lucide="trash-2" class="w-4 h-4"></i></div>
                                            <span class="font-medium">Hapus Semua Data</span>
                                        </div>
                                    </button>
                                </div>
                                <p class="text-[10px] text-gray-400 text-center mt-4">Data disimpan secara lokal di perangkat ini.</p>
                            </div>
                        </div>
                    </div>
                `;
                return html;
            }
        };

        // --- STREAMING_CHUNK:App Core controller, logic, and Cloud Sync implementation... ---
        const app = {
            currentView: 'home',
            
            init: async () => {
                ui.applyTheme();
                app.setupNav();
                app.setupModals();
                app.setupForms();
                app.setupIconSelectors();
                
                // Loading screen untuk menarik data dari database saat aplikasi baru dibuka
                if (CONFIG.GAS_URL && CONFIG.GAS_URL !== 'MASUKKAN_URL_GAS_ANDA_DISINI') {
                    document.getElementById('main-content').innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full mt-20">
                            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-primary mb-4"></div>
                            <p class="text-sm text-gray-500 font-medium">Sinkronisasi Database...</p>
                        </div>`;
                    await app.autoLoadFromCloud();
                }

                app.navigate('home');

                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (store.data.settings.theme === 'system') ui.applyTheme();
                });
            },

            navigate: (viewName) => {
                const content = document.getElementById('main-content');
                content.style.opacity = '0';
                
                setTimeout(() => {
                    content.innerHTML = views[viewName]();
                    app.currentView = viewName;
                    
                    document.querySelectorAll('.nav-item').forEach(el => {
                        const icon = el.querySelector('i');
                        const span = el.querySelector('span');
                        if (el.dataset.target === viewName) {
                            el.classList.remove('text-slate-400', 'dark:text-slate-500');
                            el.classList.add('text-primary');
                            span.classList.add('font-bold');
                            icon.classList.add('animate-pop');
                            setTimeout(() => icon.classList.remove('animate-pop'), 300);
                        } else {
                            el.classList.remove('text-primary');
                            el.classList.add('text-slate-400', 'dark:text-slate-500');
                            span.classList.remove('font-bold');
                        }
                    });

                    const nav = document.querySelector('nav');
                    const fab = document.getElementById('fab-btn');
                    if(viewName === 'settings') {
                        nav.classList.add('hidden');
                        fab.classList.add('hidden');
                    } else {
                        nav.classList.remove('hidden');
                        fab.classList.remove('hidden');
                    }

                    if(typeof lucide !== 'undefined') lucide.createIcons();
                    
                    content.style.transition = 'opacity 0.2s ease-in';
                    content.style.opacity = '1';
                }, 150);
            },

            setupNav: () => {
                document.querySelectorAll('.nav-item').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const target = e.currentTarget.dataset.target;
                        if(app.currentView !== target) app.navigate(target);
                    });
                });
            },

            setupModals: () => {
                const overlay = document.getElementById('overlay');
                const quickAdd = document.getElementById('quick-add-sheet');
                const fab = document.getElementById('fab-btn');

                const closeAll = () => {
                    overlay.classList.add('opacity-0');
                    quickAdd.classList.add('translate-y-full');
                    
                    ['task-modal', 'habit-modal'].forEach(id => {
                        const m = document.getElementById(id);
                        m.classList.add('opacity-0');
                        m.children[0].classList.add('sm:scale-95'); 
                        if(window.innerWidth < 640) m.children[0].classList.add('translate-y-full');
                        
                        setTimeout(() => m.classList.add('hidden'), 300);
                    });

                    setTimeout(() => {
                        overlay.classList.add('hidden');
                        quickAdd.classList.add('hidden');
                    }, 300);
                };

                fab.addEventListener('click', () => {
                    overlay.classList.remove('hidden');
                    quickAdd.classList.remove('hidden');
                    setTimeout(() => {
                        overlay.classList.remove('opacity-0');
                        quickAdd.classList.remove('translate-y-full');
                    }, 10);
                });

                overlay.addEventListener('click', closeAll);
                document.querySelectorAll('.close-modal-btn').forEach(btn => {
                    btn.addEventListener('click', closeAll);
                });

                app.closeModals = closeAll;
            },

            openModal: (modalId, dataId = null, defaultDate = null) => {
                document.getElementById('quick-add-sheet').classList.add('translate-y-full');
                
                const modal = document.getElementById(modalId);
                const overlay = document.getElementById('overlay');
                
                overlay.classList.remove('hidden');
                modal.classList.remove('hidden');
                
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    modal.classList.remove('opacity-0');
                    modal.children[0].classList.remove('sm:scale-95');
                    if(window.innerWidth < 640) modal.children[0].classList.remove('translate-y-full');
                }, 10);

                if (modalId === 'task-modal') {
                    const form = document.getElementById('task-form');
                    form.reset();
                    document.getElementById('task-id').value = '';
                    document.getElementById('task-date').value = defaultDate || utils.getTodayStr();
                    
                    const now = new Date();
                    document.getElementById('task-start-time').value = `${String(now.getHours()).padStart(2,'0')}:00`;
                    document.getElementById('task-modal-title').textContent = 'Tambah Jadwal';

                    if (dataId) {
                        const task = store.data.tasks.find(t => t.id === dataId);
                        if(task) {
                            document.getElementById('task-id').value = task.id;
                            document.getElementById('task-title').value = task.title;
                            document.getElementById('task-date').value = task.date;
                            document.getElementById('task-category').value = task.category;
                            document.getElementById('task-start-time').value = task.startTime;
                            document.getElementById('task-end-time').value = task.endTime;
                            document.getElementById('task-desc').value = task.desc;
                            document.getElementById('task-modal-title').textContent = 'Edit Jadwal';
                            
                            if(!document.getElementById('delete-task-btn')) {
                                const delBtn = document.createElement('button');
                                delBtn.id = 'delete-task-btn';
                                delBtn.type = 'button';
                                delBtn.className = 'w-full mt-2 text-red-500 font-medium py-3 rounded-xl hover:bg-red-50 transition-colors';
                                delBtn.innerText = 'Hapus Jadwal';
                                delBtn.onclick = () => {
                                    ui.confirm('Hapus Jadwal', `Yakin ingin menghapus "${task.title}"?`, () => {
                                        store.deleteTask(task.id);
                                        app.closeModals();
                                        app.refreshCurrentView();
                                        ui.toast('Jadwal dihapus');
                                    });
                                };
                                form.appendChild(delBtn);
                            }
                        }
                    } else {
                        const delBtn = document.getElementById('delete-task-btn');
                        if(delBtn) delBtn.remove();
                    }
                } 
                else if (modalId === 'habit-modal') {
                    const form = document.getElementById('habit-form');
                    form.reset();
                    document.getElementById('habit-id').value = '';
                    app.selectIcon('check-circle');
                    app.selectColor('blue');
                    document.getElementById('habit-modal-title').textContent = 'Tambah Habit';

                    if (dataId) {
                        const habit = store.data.habits.find(h => h.id === dataId);
                        if(habit) {
                            document.getElementById('habit-id').value = habit.id;
                            document.getElementById('habit-title').value = habit.title;
                            document.getElementById('habit-target').value = habit.target;
                            document.getElementById('habit-unit').value = habit.unit;
                            app.selectIcon(habit.icon);
                            app.selectColor(habit.color);
                            document.getElementById('habit-modal-title').textContent = 'Edit Habit';

                            if(!document.getElementById('delete-habit-btn')) {
                                const delBtn = document.createElement('button');
                                delBtn.id = 'delete-habit-btn';
                                delBtn.type = 'button';
                                delBtn.className = 'w-full mt-2 text-red-500 font-medium py-3 rounded-xl hover:bg-red-50 transition-colors';
                                delBtn.innerText = 'Hapus Habit';
                                delBtn.onclick = () => {
                                    ui.confirm('Hapus Habit', `Semua progress "${habit.title}" akan hilang. Lanjutkan?`, () => {
                                        store.deleteHabit(habit.id);
                                        app.closeModals();
                                        app.refreshCurrentView();
                                        ui.toast('Habit dihapus');
                                    });
                                };
                                form.appendChild(delBtn);
                            }
                        }
                    } else {
                        const delBtn = document.getElementById('delete-habit-btn');
                        if(delBtn) delBtn.remove();
                    }
                }
            },

            setupForms: () => {
                document.getElementById('task-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const titleInput = document.getElementById('task-title').value.trim();
                    if (!titleInput) {
                        ui.toast('Nama Aktivitas tidak boleh kosong!', 'error');
                        return;
                    }

                    const id = document.getElementById('task-id').value;
                    const taskData = {
                        title: titleInput,
                        date: document.getElementById('task-date').value,
                        category: document.getElementById('task-category').value,
                        startTime: document.getElementById('task-start-time').value,
                        endTime: document.getElementById('task-end-time').value,
                        desc: document.getElementById('task-desc').value
                    };

                    if (id) {
                        taskData.id = id;
                        store.updateTask(taskData);
                        ui.toast('Jadwal diperbarui');
                    } else {
                        store.addTask(taskData);
                        ui.toast('Jadwal ditambahkan');
                    }
                    app.closeModals();
                    app.refreshCurrentView();
                });

                document.getElementById('habit-form').addEventListener('submit', (e) => {
                    e.preventDefault();
                    
                    const titleInput = document.getElementById('habit-title').value.trim();
                    if (!titleInput) {
                        ui.toast('Nama Habit tidak boleh kosong!', 'error');
                        return;
                    }

                    const id = document.getElementById('habit-id').value;
                    const habitData = {
                        title: titleInput,
                        target: parseInt(document.getElementById('habit-target').value) || 1,
                        unit: document.getElementById('habit-unit').value,
                        icon: document.getElementById('habit-icon').value,
                        color: document.getElementById('habit-color').value
                    };

                    if (id) {
                        habitData.id = id;
                        store.updateHabit(habitData);
                        ui.toast('Habit diperbarui');
                    } else {
                        store.addHabit(habitData);
                        ui.toast('Habit ditambahkan');
                    }
                    app.closeModals();
                    app.refreshCurrentView();
                });
            },

            setupIconSelectors: () => {
                const icons = ['check-circle', 'droplet', 'book', 'dumbbell', 'moon', 'sun', 'coffee', 'heart', 'code', 'pen-tool', 'music', 'smile'];
                const colors = ['blue', 'emerald', 'pink', 'amber', 'purple', 'red'];
                
                const iconContainer = document.getElementById('icon-selector');
                icons.forEach(icon => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'p-3 rounded-xl flex items-center justify-center border-2 border-transparent hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors icon-btn';
                    btn.dataset.icon = icon;
                    btn.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 text-gray-500"></i>`;
                    btn.onclick = () => app.selectIcon(icon);
                    iconContainer.appendChild(btn);
                });

                const colorContainer = document.getElementById('color-selector');
                colors.forEach(color => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = `w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center color-btn transition-transform`;
                    btn.style.backgroundColor = utils.getHabitColorHex(color);
                    btn.dataset.color = color;
                    btn.onclick = () => app.selectColor(color);
                    colorContainer.appendChild(btn);
                });
            },

            selectIcon: (iconName) => {
                document.getElementById('habit-icon').value = iconName;
                document.querySelectorAll('.icon-btn').forEach(btn => {
                    if (btn.dataset.icon === iconName) {
                        btn.classList.add('bg-indigo-50', 'dark:bg-indigo-900/30', 'border-indigo-200', 'dark:border-indigo-700');
                        btn.querySelector('i').classList.replace('text-gray-500', 'text-primary');
                    } else {
                        btn.classList.remove('bg-indigo-50', 'dark:bg-indigo-900/30', 'border-indigo-200', 'dark:border-indigo-700');
                        btn.querySelector('i').classList.replace('text-primary', 'text-gray-500');
                    }
                });
            },

            selectColor: (colorName) => {
                document.getElementById('habit-color').value = colorName;
                document.querySelectorAll('.color-btn').forEach(btn => {
                    if (btn.dataset.color === colorName) {
                        btn.classList.add('scale-110', 'ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-darkCard', 'ring-gray-400');
                    } else {
                        btn.classList.remove('scale-110', 'ring-2', 'ring-offset-2', 'ring-offset-white', 'dark:ring-offset-darkCard', 'ring-gray-400');
                    }
                });
            },

            toggleTask: (id, event) => {
                const isCompleted = store.toggleTask(id);
                const card = event.target.closest('.bg-white, .dark\\:bg-darkCard');
                const title = card.querySelector('h4');
                const dot = card.previousElementSibling; 
                
                if (isCompleted) {
                    card.classList.add('opacity-70');
                    title.classList.add('line-through', 'decoration-2', 'decoration-gray-300');
                    dot.classList.add('!bg-primary');
                    dot.innerHTML = '<i data-lucide="check" class="w-4 h-4 text-white"></i>';
                    lucide.createIcons();
                } else {
                    card.classList.remove('opacity-70');
                    title.classList.remove('line-through', 'decoration-2', 'decoration-gray-300');
                    dot.classList.remove('!bg-primary');
                    dot.innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-white dark:bg-gray-400"></div>';
                }
                
                if(app.currentView === 'home') {
                   setTimeout(() => app.refreshCurrentView(), 300); 
                }
            },

            editTask: (id) => app.openModal('task-modal', id),
            
            editHabit: (id) => app.openModal('habit-modal', id),

            incrementHabit: (id) => {
                const result = store.updateHabitProgress(id, utils.getTodayStr());
                app.refreshCurrentView();
                
                if (result.completed && result.progress === store.data.habits.find(h=>h.id===id).target) {
                    ui.toast('Target habit tercapai! 🎉');
                }
            },

            changeTheme: (themeStr) => {
                store.data.settings.theme = themeStr;
                store.save();
                ui.applyTheme();
            },

            clearData: () => {
                ui.confirm('Hapus Semua Data', 'Semua jadwal, habit, dan pengaturan akan dihapus permanen.', () => {
                    localStorage.removeItem(StorageKey);
                    location.reload();
                });
            },

            exportData: () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(store.data));
                const dlAnchorElem = document.createElement('a');
                dlAnchorElem.setAttribute("href", dataStr);
                dlAnchorElem.setAttribute("download", "myschedule_backup.json");
                dlAnchorElem.click();
                ui.toast('Data berhasil diekspor');
            },

            // --- STREAMING_CHUNK:Database Auto Sync Logic... ---
            autoLoadFromCloud: async () => {
                try {
                    const response = await fetch(CONFIG.GAS_URL);
                    const cloudData = await response.json();
                    
                    if (cloudData && cloudData.tasks && cloudData.settings) {
                        store.data = cloudData;
                        // Simpan ke local tanpa trigger setTimeout save()
                        localStorage.setItem(StorageKey, JSON.stringify(store.data));
                        ui.applyTheme();
                    }
                } catch (error) {
                    console.error("Gagal load dari cloud:", error);
                    ui.toast('Gagal konek ke database. Memakai data lokal.', 'error');
                }
            },

            refreshCurrentView: () => {
                app.navigate(app.currentView);
            }
        };

        // Mengekspos fungsi-fungsi utama agar bisa dipanggil dari HTML
        window.app = app;
        window.views = views;

        // Start App
        document.addEventListener('DOMContentLoaded', () => {
            app.init();
            
            // Tambahan perlindungan untuk dark mode listener pada browser lama
            if (window.matchMedia) {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                    if (store.data.settings.theme === 'system') ui.applyTheme();
                });
            }
        });

    </script>
</body>
</html>
