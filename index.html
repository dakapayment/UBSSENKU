<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Life Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#4F46E5', // Indigo 600
                        secondary: '#10B981', // Emerald 500
                        darkbg: '#111827',
                        darkcard: '#1F2937'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        
        /* Animasi Transisi */
        .page-transition { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Checkbox Custom */
        .custom-checkbox input:checked + div { background-color: #10B981; border-color: #10B981; }
        .custom-checkbox input:checked + div svg { display: block; }
        
        /* Loading Spinner */
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #4F46E5; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 dark:bg-gray-900 dark:text-gray-100 transition-colors duration-300">

<div class="app-container bg-gray-50 dark:bg-darkbg flex flex-col">
    
    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen" class="flex-1 flex flex-col justify-center px-6 page-transition">
        <div class="text-center mb-10">
            <div class="inline-block p-4 rounded-full bg-indigo-100 text-primary mb-4">
                <i class="fas fa-leaf text-4xl"></i>
            </div>
            <h1 class="text-3xl font-bold mb-2">My Life Schedule</h1>
            <p class="text-gray-500 dark:text-gray-400">Atur hari, bangun kebiasaan baik.</p>
        </div>
        
        <div class="bg-white dark:bg-darkcard p-6 rounded-2xl shadow-sm border dark:border-gray-800">
            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" id="login-username" class="w-full p-3 bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan username">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="login-password" class="w-full p-3 bg-gray-50 dark:bg-gray-800 border dark:border-gray-700 rounded-xl focus:ring-2 focus:ring-primary outline-none" placeholder="Masukkan password">
            </div>
            <p id="login-error" class="text-red-500 text-sm mb-4 hidden text-center"></p>
            <button onclick="handleLogin()" class="w-full bg-primary text-white p-3 rounded-xl font-semibold flex justify-center items-center gap-2 active:scale-95 transition-transform">
                <span id="login-text">Masuk</span>
                <div id="login-spinner" class="loader hidden"></div>
            </button>
        </div>
    </div>

    <!-- 2. APP MAIN LAYOUT (Hidden initially) -->
    <div id="app-screen" class="hidden flex-1 flex flex-col h-screen">
        
        <!-- Top Bar / Header -->
        <header class="pt-10 pb-4 px-6 bg-white dark:bg-darkcard shadow-sm z-10 sticky top-0">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-sm text-gray-500 dark:text-gray-400" id="header-date">Selasa, 13 Ags 2026</h2>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        Halo, <span id="header-name">User</span> 👋
                    </h1>
                </div>
                <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center text-white font-bold shadow-md cursor-pointer" onclick="switchTab('profile')">
                    <span id="header-initial">U</span>
                </div>
            </div>
        </header>

        <!-- Main Content Area (Scrollable) -->
        <main class="flex-1 overflow-y-auto hide-scroll pb-24 relative" id="main-content">
            <!-- Loading Overlay -->
            <div id="page-loader" class="absolute inset-0 bg-gray-50/80 dark:bg-darkbg/80 z-20 flex justify-center py-20 hidden">
                <div class="loader border-primary"></div>
            </div>

            <!-- TAB: HOME -->
            <div id="tab-home" class="p-6 page-transition">
                <!-- Progress Section -->
                <div class="bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl p-5 text-white shadow-lg mb-8">
                    <div class="flex justify-between items-end mb-3">
                        <div>
                            <h3 class="font-medium opacity-90">Progress Hari Ini</h3>
                            <p class="text-3xl font-bold mt-1" id="home-progress-text">0 / 0</p>
                        </div>
                        <i class="fas fa-trophy text-4xl opacity-20"></i>
                    </div>
                    <div class="w-full bg-white/20 rounded-full h-2 mt-2">
                        <div class="bg-white h-2 rounded-full transition-all duration-1000" id="home-progress-bar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Habits Section -->
                <div class="mb-8">
                    <h3 class="font-bold text-lg mb-3 flex items-center gap-2"><i class="fas fa-fire text-orange-500"></i> Habit Hari Ini</h3>
                    <div class="flex gap-3 overflow-x-auto hide-scroll pb-2" id="home-habits-container">
                        <!-- Disuntik via JS -->
                    </div>
                </div>

                <!-- Jadwal Section -->
                <div>
                    <h3 class="font-bold text-lg mb-3 flex justify-between items-center">
                        <span><i class="far fa-clock text-primary"></i> Jadwal Saya</span>
                        <button onclick="switchTab('jadwal')" class="text-sm text-primary font-medium">Lihat Semua</button>
                    </h3>
                    <div class="space-y-3" id="home-jadwal-container">
                        <!-- Disuntik via JS -->
                    </div>
                </div>
            </div>

            <!-- TAB: JADWAL -->
            <div id="tab-jadwal" class="hidden p-6 page-transition">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Jadwal</h2>
                    <input type="date" id="jadwal-date-picker" class="p-2 rounded-lg border dark:border-gray-700 bg-white dark:bg-darkcard text-sm focus:outline-none focus:ring-1 focus:ring-primary" onchange="loadJadwalList()">
                </div>

                <!-- Template Routine Buttons -->
                <div class="mb-6 overflow-x-auto hide-scroll pb-2 flex gap-2">
                    <button onclick="applyRoutine('pagi')" class="whitespace-nowrap px-4 py-2 bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400 rounded-full text-sm font-medium"><i class="fas fa-sun mr-1"></i> Rutinitas Pagi</button>
                    <button onclick="applyRoutine('malam')" class="whitespace-nowrap px-4 py-2 bg-indigo-100 text-indigo-700 dark:bg-indigo-900/30 dark:text-indigo-400 rounded-full text-sm font-medium"><i class="fas fa-moon mr-1"></i> Rutinitas Malam</button>
                </div>

                <div class="space-y-3" id="jadwal-full-list">
                    <!-- Disuntik via JS -->
                </div>

                <!-- FAB Tambah -->
                <button onclick="toggleModal('modal-jadwal')" class="fixed bottom-24 right-6 w-14 h-14 bg-primary text-white rounded-full shadow-lg flex items-center justify-center text-xl hover:scale-105 transition-transform active:scale-95 z-30">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- TAB: HABIT -->
            <div id="tab-habit" class="hidden p-6 page-transition">
                <h2 class="text-2xl font-bold mb-6">Habit Tracker</h2>
                <div class="grid grid-cols-2 gap-4" id="habit-full-list">
                    <!-- Disuntik via JS -->
                </div>
                <button onclick="toggleModal('modal-habit')" class="mt-6 w-full py-3 border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-xl text-gray-500 font-medium hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    + Tambah Habit Baru
                </button>
            </div>

            <!-- TAB: PROFILE -->
            <div id="tab-profile" class="hidden p-6 page-transition">
                <h2 class="text-2xl font-bold mb-6">Profil & Pengaturan</h2>
                <div class="bg-white dark:bg-darkcard rounded-2xl p-6 text-center border dark:border-gray-800 shadow-sm mb-6">
                    <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-primary to-purple-500 flex items-center justify-center text-white text-3xl font-bold shadow-md mb-4" id="profile-initial">U</div>
                    <h3 class="text-xl font-bold" id="profile-name">User Name</h3>
                    <p class="text-gray-500 text-sm mb-4" id="profile-username">@username</p>
                    <div class="inline-block px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold" id="profile-role">Admin</div>
                </div>

                <div class="space-y-4">
                    <div class="bg-white dark:bg-darkcard p-4 rounded-xl flex justify-between items-center border dark:border-gray-800">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-moon text-gray-400"></i>
                            <span class="font-medium">Dark Mode</span>
                        </div>
                        <button onclick="toggleDarkMode()" class="w-12 h-6 rounded-full bg-gray-200 dark:bg-primary relative transition-colors">
                            <div class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 dark:translate-x-6 transition-transform shadow-sm"></div>
                        </button>
                    </div>
                    <button onclick="logout()" class="w-full bg-red-50 text-red-600 dark:bg-red-900/20 dark:text-red-400 p-4 rounded-xl font-semibold flex justify-center items-center gap-2 border border-red-100 dark:border-red-900">
                        <i class="fas fa-sign-out-alt"></i> Keluar Aplikasi
                    </button>
                </div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 w-full max-w-[480px] bg-white dark:bg-darkcard border-t dark:border-gray-800 flex justify-around items-center h-20 px-2 pb-2 z-20">
            <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center gap-1 w-16 text-primary" data-tab="home">
                <i class="fas fa-home text-xl"></i>
                <span class="text-[10px] font-medium">Home</span>
            </button>
            <button onclick="switchTab('jadwal')" class="nav-btn flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-primary transition-colors" data-tab="jadwal">
                <i class="far fa-calendar-alt text-xl"></i>
                <span class="text-[10px] font-medium">Jadwal</span>
            </button>
            <button onclick="switchTab('habit')" class="nav-btn flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-primary transition-colors" data-tab="habit">
                <i class="fas fa-fire text-xl"></i>
                <span class="text-[10px] font-medium">Habit</span>
            </button>
            <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center gap-1 w-16 text-gray-400 hover:text-primary transition-colors" data-tab="profile">
                <i class="far fa-user text-xl"></i>
                <span class="text-[10px] font-medium">Profil</span>
            </button>
        </nav>
    </div>

    <!-- MODAL TAMBAH JADWAL -->
    <div id="modal-jadwal" class="fixed inset-0 bg-black/60 z-50 hidden flex flex-col justify-end transition-opacity">
        <div class="bg-white dark:bg-darkcard w-full max-w-[480px] mx-auto rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300" id="modal-jadwal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">Tambah Jadwal</h3>
                <button onclick="toggleModal('modal-jadwal')" class="text-gray-400 text-xl"><i class="fas fa-times"></i></button>
            </div>
            <form id="form-jadwal" onsubmit="submitJadwal(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Judul Kegiatan</label>
                    <input type="text" id="j-judul" required class="w-full p-3 bg-gray-50 dark:bg-gray-800 border rounded-xl outline-none focus:ring-1 focus:ring-primary dark:border-gray-700">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Jam Mulai</label>
                        <input type="time" id="j-mulai" required class="w-full p-3 bg-gray-50 dark:bg-gray-800 border rounded-xl outline-none focus:ring-1 focus:ring-primary dark:border-gray-700">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Jam Selesai</label>
                        <input type="time" id="j-selesai" required class="w-full p-3 bg-gray-50 dark:bg-gray-800 border rounded-xl outline-none focus:ring-1 focus:ring-primary dark:border-gray-700">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Kategori</label>
                        <select id="j-kategori" class="w-full p-3 bg-gray-50 dark:bg-gray-800 border rounded-xl outline-none focus:ring-1 focus:ring-primary dark:border-gray-700">
                            <option>Pribadi</option><option>Kesehatan</option><option>Produktivitas</option><option>Ibadah</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Pengulangan</label>
                        <select id="j-repeat" class="w-full p-3 bg-gray-50 dark:bg-gray-800 border rounded-xl outline-none focus:ring-1 focus:ring-primary dark:border-gray-700">
                            <option>Tidak berulang</option><option>Setiap hari</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="w-full bg-primary text-white p-3 rounded-xl font-bold mt-4">Simpan Jadwal</button>
            </form>
        </div>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT ---
    let currentUser = null;
    let currentTheme = 'light';
    let todayDateStr = new Date().toISOString().split('T')[0];
    let selectedDateStr = todayDateStr;

    // Inisialisasi
    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById('jadwal-date-picker').value = todayDateStr;
        updateHeaderDate();
        
        // Pura-pura cek session (Dalam implementasi aseli GAS HTML tidak punya localStorage kuat tanpa iframe sandbox, kita akan simpan di memory aja untuk sesi ini)
    });

    function updateHeaderDate() {
        const options = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
        document.getElementById('header-date').innerText = new Date().toLocaleDateString('id-ID', options);
    }

    // --- AUTHENTICATION ---
    function handleLogin() {
        const user = document.getElementById('login-username').value;
        const pass = document.getElementById('login-password').value;
        const btnText = document.getElementById('login-text');
        const spinner = document.getElementById('login-spinner');
        const error = document.getElementById('login-error');

        if(!user || !pass) return;

        btnText.classList.add('hidden');
        spinner.classList.remove('hidden');
        error.classList.add('hidden');

        // Panggil backend
        google.script.run
            .withSuccessHandler((response) => {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                
                if(response.success) {
                    currentUser = response.data;
                    setupUserProfile();
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    loadDashboard();
                } else {
                    error.innerText = response.message;
                    error.classList.remove('hidden');
                }
            })
            .withFailureHandler((err) => {
                btnText.classList.remove('hidden');
                spinner.classList.add('hidden');
                error.innerText = "Koneksi gagal.";
                error.classList.remove('hidden');
            })
            .loginUser(user, pass);
    }

    function logout() {
        currentUser = null;
        document.getElementById('app-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
    }

    function setupUserProfile() {
        document.getElementById('header-name').innerText = currentUser.Nama.split(' ')[0];
        document.getElementById('header-initial').innerText = currentUser.Nama.charAt(0).toUpperCase();
        
        document.getElementById('profile-name').innerText = currentUser.Nama;
        document.getElementById('profile-username').innerText = '@' + currentUser.Username;
        document.getElementById('profile-role').innerText = currentUser.Role;
        document.getElementById('profile-initial').innerText = currentUser.Nama.charAt(0).toUpperCase();
    }

    // --- NAVIGATION ---
    function switchTab(tabId) {
        // Update Buttons
        document.querySelectorAll('.nav-btn').forEach(btn => {
            if(btn.dataset.tab === tabId) {
                btn.classList.remove('text-gray-400');
                btn.classList.add('text-primary');
            } else {
                btn.classList.add('text-gray-400');
                btn.classList.remove('text-primary');
            }
        });

        // Update Content
        ['home', 'jadwal', 'habit', 'profile'].forEach(id => {
            document.getElementById(`tab-${id}`).classList.add('hidden');
        });
        document.getElementById(`tab-${tabId}`).classList.remove('hidden');

        // Load specific data
        if(tabId === 'home') loadDashboard();
        if(tabId === 'jadwal') loadJadwalList();
        if(tabId === 'habit') loadHabits();
    }

    // --- DATA LOADING ---
    function showPageLoader(show) {
        const loader = document.getElementById('page-loader');
        if(show) loader.classList.remove('hidden');
        else loader.classList.add('hidden');
    }

    function loadDashboard() {
        showPageLoader(true);
        google.script.run
            .withSuccessHandler(renderDashboard)
            .getDashboardData(currentUser.Username, todayDateStr);
    }

    function renderDashboard(data) {
        showPageLoader(false);
        
        // Render Progress
        const percent = data.progress.total === 0 ? 0 : Math.round((data.progress.selesai / data.progress.total) * 100);
        document.getElementById('home-progress-text').innerText = `${data.progress.selesai} / ${data.progress.total} selesai`;
        document.getElementById('home-progress-bar').style.width = `${percent}%`;

        // Render Habits (Mini)
        const hc = document.getElementById('home-habits-container');
        hc.innerHTML = '';
        if(data.habits.length === 0) hc.innerHTML = '<p class="text-sm text-gray-500">Belum ada habit aktif.</p>';
        data.habits.forEach(h => {
            const bgClass = h.isDone ? 'bg-secondary text-white border-secondary' : 'bg-white dark:bg-darkcard border dark:border-gray-700';
            const icon = h.isDone ? '<i class="fas fa-check-circle"></i>' : '<i class="far fa-circle"></i>';
            hc.innerHTML += `
                <div onclick="${!h.isDone ? `completeHabit('${h.ID}')` : ''}" class="flex-shrink-0 w-28 p-3 rounded-xl flex flex-col items-center justify-center text-center gap-2 cursor-pointer transition-colors ${bgClass}">
                    <div class="text-xl">${icon}</div>
                    <span class="text-xs font-semibold whitespace-nowrap overflow-hidden text-ellipsis w-full">${h.NamaHabit}</span>
                </div>
            `;
        });

        // Render Jadwal
        const jc = document.getElementById('home-jadwal-container');
        jc.innerHTML = '';
        if(data.jadwal.length === 0) jc.innerHTML = '<p class="text-sm text-gray-500 text-center py-4 border rounded-xl border-dashed">Tidak ada jadwal hari ini.</p>';
        data.jadwal.forEach(j => {
            const isDone = j.Status === 'Selesai';
            jc.innerHTML += `
                <div class="bg-white dark:bg-darkcard border dark:border-gray-800 p-4 rounded-xl flex items-center gap-4 ${isDone ? 'opacity-60' : ''}">
                    <label class="custom-checkbox relative flex items-center justify-center cursor-pointer">
                        <input type="checkbox" class="sr-only" ${isDone ? 'checked disabled' : ''} onchange="markJadwalDone('${j.ID}', this)">
                        <div class="w-6 h-6 border-2 border-gray-300 dark:border-gray-600 rounded flex items-center justify-center transition-colors">
                            <svg class="w-4 h-4 text-white hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                    </label>
                    <div class="flex-1">
                        <h4 class="font-bold text-base ${isDone ? 'line-through' : ''}">${j.Judul}</h4>
                        <div class="flex items-center gap-2 text-xs text-gray-500 mt-1">
                            <span><i class="far fa-clock"></i> ${j.JamMulai} - ${j.JamSelesai}</span>
                            <span>•</span>
                            <span class="bg-gray-100 dark:bg-gray-800 px-2 py-0.5 rounded text-primary">${j.Kategori}</span>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    // --- ACTIONS ---
    function markJadwalDone(id, checkbox) {
        if(!checkbox.checked) return; // Only allow checking, not unchecking for simplicity
        checkbox.disabled = true;
        google.script.run
            .withSuccessHandler(() => { loadDashboard(); })
            .updateJadwalStatus(id, currentUser.Username, 'Selesai');
    }

    function completeHabit(id) {
        google.script.run
            .withSuccessHandler((res) => {
                if(res.success) {
                    loadDashboard();
                    if(!document.getElementById('tab-habit').classList.contains('hidden')) loadHabits();
                }
            })
            .logHabit(currentUser.Username, id, todayDateStr);
    }

    // --- JADWAL TAB ---
    function loadJadwalList() {
        const date = document.getElementById('jadwal-date-picker').value;
        showPageLoader(true);
        google.script.run
            .withSuccessHandler((data) => {
                showPageLoader(false);
                const jc = document.getElementById('jadwal-full-list');
                jc.innerHTML = '';
                if(data.jadwal.length === 0) jc.innerHTML = '<p class="text-center text-gray-500 py-10">Jadwal kosong.</p>';
                
                data.jadwal.forEach(j => {
                    const isDone = j.Status === 'Selesai';
                    jc.innerHTML += `
                        <div class="bg-white dark:bg-darkcard border-l-4 border-primary p-4 rounded-xl shadow-sm flex justify-between items-center ${isDone ? 'opacity-50' : ''}">
                            <div>
                                <h4 class="font-bold ${isDone ? 'line-through' : ''}">${j.Judul}</h4>
                                <p class="text-sm text-gray-500">${j.JamMulai} - ${j.JamSelesai} | ${j.Kategori}</p>
                            </div>
                            ${!isDone ? `<button onclick="markJadwalDone('${j.ID}', {checked:true})" class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center text-gray-300 hover:bg-secondary hover:text-white hover:border-secondary transition-colors"><i class="fas fa-check"></i></button>` : `<div class="w-8 h-8 rounded-full bg-secondary text-white flex items-center justify-center"><i class="fas fa-check"></i></div>`}
                        </div>
                    `;
                });
            })
            .getDashboardData(currentUser.Username, date); // Reusing logic for ease
    }

    // --- MODALS ---
    function toggleModal(modalId) {
        const modal = document.getElementById(modalId);
        const content = modal.querySelector('div');
        
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('translate-y-full');
            }, 10);
        } else {
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    }

    function submitJadwal(e) {
        e.preventDefault();
        const data = {
            username: currentUser.Username,
            tanggal: document.getElementById('jadwal-date-picker').value,
            judul: document.getElementById('j-judul').value,
            jamMulai: document.getElementById('j-mulai').value,
            jamSelesai: document.getElementById('j-selesai').value,
            kategori: document.getElementById('j-kategori').value,
            repeat: document.getElementById('j-repeat').value,
            catatan: ''
        };
        
        toggleModal('modal-jadwal');
        showPageLoader(true);
        google.script.run
            .withSuccessHandler(() => {
                e.target.reset();
                loadJadwalList();
                if(!document.getElementById('tab-home').classList.contains('hidden')) loadDashboard();
            })
            .addJadwal(data);
    }

    // --- TEMPLATE ROUTINE (Frontend Logic) ---
    function applyRoutine(type) {
        const date = document.getElementById('jadwal-date-picker').value;
        const routines = [];
        
        if(type === 'pagi') {
            routines.push({username: currentUser.Username, tanggal: date, judul: 'Bangun & Ibadah', jamMulai: '05:00', jamSelesai: '05:30', kategori: 'Ibadah', repeat: 'Tidak berulang', catatan: ''});
            routines.push({username: currentUser.Username, tanggal: date, judul: 'Olahraga Pagi', jamMulai: '05:30', jamSelesai: '06:15', kategori: 'Kesehatan', repeat: 'Tidak berulang', catatan: ''});
            routines.push({username: currentUser.Username, tanggal: date, judul: 'Mandi & Sarapan', jamMulai: '06:15', jamSelesai: '07:00', kategori: 'Pribadi', repeat: 'Tidak berulang', catatan: ''});
        } else if (type === 'malam') {
            routines.push({username: currentUser.Username, tanggal: date, judul: 'Evaluasi Hari', jamMulai: '20:30', jamSelesai: '21:00', kategori: 'Produktivitas', repeat: 'Tidak berulang', catatan: ''});
            routines.push({username: currentUser.Username, tanggal: date, judul: 'Membaca Buku', jamMulai: '21:00', jamSelesai: '21:45', kategori: 'Pribadi', repeat: 'Tidak berulang', catatan: ''});
        }

        if(!confirm(`Tambahkan template Rutinitas ${type} ke tanggal ini?`)) return;

        showPageLoader(true);
        // Sequential add for simplicity in this demo to avoid overlapping async issues in GAS
        let added = 0;
        routines.forEach(r => {
            google.script.run.withSuccessHandler(() => {
                added++;
                if(added === routines.length) loadJadwalList();
            }).addJadwal(r);
        });
    }

    // --- HABIT & UI UTILS ---
    function loadHabits() {
        showPageLoader(true);
        google.script.run
            .withSuccessHandler((streaks) => {
                showPageLoader(false);
                const hc = document.getElementById('habit-full-list');
                hc.innerHTML = '';
                streaks.forEach(h => {
                    hc.innerHTML += `
                        <div class="bg-white dark:bg-darkcard border dark:border-gray-800 p-4 rounded-xl text-center shadow-sm">
                            <div class="w-12 h-12 mx-auto bg-orange-100 text-orange-500 rounded-full flex items-center justify-center text-xl mb-2">
                                <i class="fas fa-fire"></i>
                            </div>
                            <h4 class="font-bold text-sm mb-1">${h.NamaHabit}</h4>
                            <p class="text-xs text-gray-500 mb-3">${h.Target}</p>
                            <div class="text-xs font-semibold bg-gray-100 dark:bg-gray-800 py-1 px-2 rounded inline-block mb-3">
                                🔥 ${h.currentStreak} Total
                            </div>
                            <button onclick="completeHabit('${h.ID}')" class="w-full py-2 bg-primary text-white rounded-lg text-sm font-medium">Selesaikan Hari Ini</button>
                        </div>
                    `;
                });
            })
            .getHabitStreaks(currentUser.Username);
    }

    function toggleDarkMode() {
        if(currentTheme === 'light') {
            document.documentElement.classList.add('dark');
            currentTheme = 'dark';
        } else {
            document.documentElement.classList.remove('dark');
            currentTheme = 'light';
        }
    }
</script>
</body>
